name: Create Release Tag

on:
  workflow_dispatch:
    inputs:
      kernel_major_version:
        description: '内核版本'
        required: true
        type: string
        default: '6.12'
      feeds_branch:
        description: '使用的 OpenWrt 分支'
        required: true
        type: string
        default: 'openwrt-25.12'

jobs:
  create_tag_and_pin_feeds:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Tag, Pin Feeds and Push
        run: |
          set -e

          # 1. ===== 配置基本变量 =====
          KERNEL_MAJOR_VERSION="${{ github.event.inputs.kernel_major_version }}"
          DEFAULT_FEEDS_BRANCH="${{ github.event.inputs.feeds_branch }}"
          
          KERNEL_VERSION_FILE="target/linux/generic/kernel-${KERNEL_MAJOR_VERSION}"
          FEEDS_CONFIG="feeds.conf.default"
          FEEDS_TO_PIN="packages luci routing telephony video"
          CURRENT_BRANCH="${GITHUB_REF#refs/heads/}"

          echo "🐱 当前运行分支: ${CURRENT_BRANCH}"
          echo "🐱 锁定目标分支: ${DEFAULT_FEEDS_BRANCH}"
          echo "🐱 准备为内核版本 ${KERNEL_MAJOR_VERSION} 更新稳定版 Tag..."

          # 2. ===== 解析内核版本 =====
          if [ ! -f "$KERNEL_VERSION_FILE" ]; then
            echo "😿 错误：内核版本文件 '$KERNEL_VERSION_FILE' 不存在！"
            exit 1
          fi
          
          PATCH_VERSION=$(grep "LINUX_VERSION-${KERNEL_MAJOR_VERSION}" "$KERNEL_VERSION_FILE" | cut -d'=' -f2 | tr -d ' .')
          if [ -z "$PATCH_VERSION" ]; then
            echo "😿 错误：无法解析内核补丁版本号！"
            exit 1
          fi
          
          TAG_NAME="${KERNEL_MAJOR_VERSION}.${PATCH_VERSION}"
          echo "✅ 目标 Tag: ${TAG_NAME}"

          # 3. ===== 锁定 Feeds Commit =====
          echo "🚀 开始更新并锁定 feeds.conf.default..."

          for feed_name in $FEEDS_TO_PIN; do
            FEED_LINE=$(grep "^src-git ${feed_name} " "$FEEDS_CONFIG")

            if [ -z "$FEED_LINE" ]; then
              echo "⚠️  警告：未找到 '${feed_name}'，跳过。"
              continue
            fi
            
            # 1. 获取原始 URI
            RAW_URI=$(echo "$FEED_LINE" | awk '{print $3}')
            
            # 2. 剥离 hash 和 ;branch，只留纯URL (https://github.com/....git)
            BASE_NO_HASH=$(echo "$RAW_URI" | cut -d'^' -f1)
            REAL_URL=$(echo "$BASE_NO_HASH" | cut -d';' -f1)
            
            # 3. === 确定要查询的分支 ===
            
            if [[ "$BASE_NO_HASH" == *";"* ]]; then
              BRANCH_TO_QUERY=$(echo "$BASE_NO_HASH" | cut -d';' -f2)
              echo "🔍 [${feed_name}] 发现文件内指定分支: $BRANCH_TO_QUERY"
            else
              BRANCH_TO_QUERY="$DEFAULT_FEEDS_BRANCH"
              echo "🔍 [${feed_name}] 文件内无分支信息，使用默认分支: $BRANCH_TO_QUERY"
            fi
            
            # 4. 获取对应分支的最新 Hash
            echo "   👉 正在从 $BRANCH_TO_QUERY 获取最新 Commit..."
            COMMIT_HASH=$(git ls-remote "$REAL_URL" "$BRANCH_TO_QUERY" | awk '{print $1}')

            if [ -z "$COMMIT_HASH" ]; then
              echo "😿 警告：无法从上游获取 hash，跳过更新。"
              continue
            fi

            echo "   ✅ 锁定 Hash: ${COMMIT_HASH}"
            
            NEW_LINE="src-git ${feed_name} ${REAL_URL}^${COMMIT_HASH}"
            
            sed -i "s|^src-git ${feed_name} .*|${NEW_LINE}|" "$FEEDS_CONFIG"
          done

          echo "🎉 Feeds 配置已修正并锁定。"

          # 4. ===== Git 提交、同步与推送 =====
          echo "📝 配置 Git 用户..."
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          if git diff --quiet "$FEEDS_CONFIG"; then
            echo "💤 内容无变化，跳过提交。"
          else
            echo "💾 提交更改..."
            git add "$FEEDS_CONFIG"
            git commit -m "chore: Update feeds to ${DEFAULT_FEEDS_BRANCH} latest for ${TAG_NAME}"
          fi

          echo "🔄 同步远程代码..."
          git pull --rebase origin "$CURRENT_BRANCH"

          # 5. ===== 强制更新 Tag =====
          echo "🏷️  处理 Tag..."

          if git tag -l | grep -q "^${TAG_NAME}$"; then
             git tag -d "${TAG_NAME}"
          fi

          if git ls-remote --tags origin | grep -q "refs/tags/${TAG_NAME}"; then
             echo "   🧹 删除远程旧 Tag..."
             git push origin --delete "${TAG_NAME}"
          fi
          
          echo "   ✨ 创建新 Tag: ${TAG_NAME}"
          git tag -a "${TAG_NAME}" -m "Auto-release ${TAG_NAME} based on ${DEFAULT_FEEDS_BRANCH}"

          echo "🚀 推送..."
          git push origin HEAD:"refs/heads/${CURRENT_BRANCH}"
          git push origin "${TAG_NAME}"

          echo "✅ 完成！"

      - name: Delete older workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 1
          keep_minimum_runs: 5
